<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁设计典型场景计算演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        body {
            background: #f4f6f9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h1 {
            font-size: 26px;
            color: #1a3c5e;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .type-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .type-btn {
            padding: 10px 18px;
            border: 2px solid #2c6b9e;
            background: #fff;
            color: #2c6b9e;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .type-btn:hover {
            background: #e8f0f8;
        }
        .type-btn.active {
            background: #2c6b9e;
            color: #fff;
            font-weight: bold;
        }
        .param-area {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .param-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .param-group label {
            font-size: 14px;
            color: #333;
        }
        .param-group input[type="range"] {
            width: 160px;
        }
        .param-group .value {
            min-width: 50px;
            font-weight: bold;
            color: #1a3c5e;
        }
        .reset-btn {
            padding: 8px 16px;
            background: #f0a030;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: #d98e20;
        }
        canvas {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafbfc;
            margin-bottom: 20px;
        }
        .result-area {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #2c6b9e;
        }
        .result-area h3 {
            color: #1a3c5e;
            margin-bottom: 12px;
        }
        .calc-step {
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }
        .highlight {
            background: #fff3cd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .warning {
            color: #d9534f;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background: #e9ecef;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>梁设计典型场景计算演示</h1>
    <p class="subtitle">点击不同梁类型查看计算模型、配筋与抗震构造要求（参数可调节）</p>

    <div class="type-buttons">
        <button class="type-btn active" data-type="main">框架梁（主梁）</button>
        <button class="type-btn" data-type="secondary">次梁</button>
        <button class="type-btn" data-type="coupling">连梁</button>
        <button class="type-btn" data-type="curved">弧形梁</button>
        <button class="type-btn" data-type="steel">工字钢梁</button>
        <button class="type-btn" data-type="lintel">构造梁（过梁）</button>
    </div>

    <div class="param-area">
        <div class="param-group">
            <label>跨度 L (m)：</label>
            <input type="range" id="spanSlider" min="1" max="12" step="0.5" value="6">
            <span class="value" id="spanValue">6.0</span>
        </div>
        <div class="param-group">
            <label>荷载 q (kN/m)：</label>
            <input type="range" id="loadSlider" min="5" max="150" step="1" value="30">
            <span class="value" id="loadValue">30</span>
        </div>
        <button class="reset-btn" id="resetBtn">恢复典型参数</button>
    </div>

    <canvas id="beamCanvas" width="900" height="400"></canvas>

    <div class="result-area" id="resultArea">
        <h3>计算结果与构造要求</h3>
        <div class="calc-step" id="calcText">请选择梁类型查看详情。</div>
    </div>
</div>

<script>
    // ==================== 全局变量与DOM引用 ====================
    const canvas = document.getElementById('beamCanvas');
    const ctx = canvas.getContext('2d');
    const spanSlider = document.getElementById('spanSlider');
    const loadSlider = document.getElementById('loadSlider');
    const spanValue = document.getElementById('spanValue');
    const loadValue = document.getElementById('loadValue');
    const calcText = document.getElementById('calcText');
    const resetBtn = document.getElementById('resetBtn');
    const typeButtons = document.querySelectorAll('.type-btn');

    // ==================== 梁类型默认参数与计算规则 ====================
    const beamTypes = {
        main: {
            name: '框架梁（主梁）',
            defaultSpan: 6,
            defaultLoad: 30,
            model: '两端与柱刚接（按固接梁简化）',
            momentFormula: '跨中 M+ = qL²/24，支座 M- = qL²/12',
            shearFormula: 'V = qL/2',
            calc: function(L, q) {
                const Mpos = q * L * L / 24;   // kN·m
                const Mneg = q * L * L / 12;   // kN·m
                const V = q * L / 2;           // kN
                return { Mpos, Mneg, V };
            },
            reinforcement: function(L, q, result) {
                // 混凝土梁 300x600, h0=560, fy=360
                const fy = 360, h0 = 560, b = 300;
                const Mmax = Math.abs(result.Mneg);
                const As = Mmax * 1e6 / (0.9 * fy * h0); // mm²
                return { As, fy, h0, b };
            },
            seismic: function(L, q) {
                return `抗震等级：二级框架\n` +
                       `梁端箍筋加密区长度 ≥ max(1.5×600, 500) = 900 mm\n` +
                       `加密区箍筋间距 ≤ min(600/4, 8×20, 100) = 100 mm\n` +
                       `非加密区箍筋间距 ≤ 200 mm\n` +
                       `纵筋配筋率要求：0.3% ≤ ρ ≤ 2.5%，且不小于 65ft/fy = 65×1.43/360 = 0.258%\n` +
                       `梁端底面和顶面纵筋比值 ≥ 0.5（一级）或 0.3（二级）`;
            }
        },
        secondary: {
            name: '次梁',
            defaultSpan: 6,
            defaultLoad: 20,
            model: '两端简支在主梁上',
            momentFormula: '跨中最大弯矩 M = qL²/8',
            shearFormula: 'V = qL/2',
            calc: function(L, q) {
                const M = q * L * L / 8;
                const V = q * L / 2;
                return { M, V };
            },
            reinforcement: function(L, q, result) {
                const fy = 360, h0 = 560, b = 300;
                const Mmax = result.M;
                const As = Mmax * 1e6 / (0.9 * fy * h0);
                return { As, fy, h0, b };
            },
            seismic: function(L, q) {
                return `抗震要求：无特殊抗震要求（非抗震构件）\n` +
                       `箍筋按构造配置：φ8@200\n` +
                       `纵筋最小配筋率：0.2% 和 45ft/fy = 45×1.43/360 = 0.179%，取大值`;
            }
        },
        coupling: {
            name: '连梁',
            defaultSpan: 2,
            defaultLoad: 100,
            model: '两端与剪力墙刚接，跨高比小（L/h < 5）',
            momentFormula: '按固接梁：支座 M- = qL²/12，跨中 M+ = qL²/24',
            shearFormula: 'V = qL/2（注意：实际剪力设计值需按强剪弱弯调整）',
            calc: function(L, q) {
                const Mpos = q * L * L / 24;
                const Mneg = q * L * L / 12;
                const V = q * L / 2;
                return { Mpos, Mneg, V };
            },
            reinforcement: function(L, q, result) {
                const fy = 360, h0 = 560, b = 300;
                const Mmax = Math.abs(result.Mneg);
                const As = Mmax * 1e6 / (0.9 * fy * h0);
                // 连梁箍筋需按受剪计算，这里简化给出构造要求
                return { As, fy, h0, b };
            },
            seismic: function(L, q) {
                return `抗震要求：连梁是抗震第一道防线，要求极高\n` +
                       `箍筋全长加密，间距 ≤ 100 mm，直径 ≥ 10 mm（通常 φ10@100）\n` +
                       `纵向受力钢筋对称配置，配筋率 ≥ 0.6%，且 ≤ 2.5%\n` +
                       `梁端箍筋加密区范围 ≥ 2倍梁高，全长加密\n` +
                       `连梁剪力设计值需满足 V ≤ 0.15βcfcbh0 / γRE（需专门验算）`;
            }
        },
        curved: {
            name: '弧形梁',
            defaultSpan: 6,
            defaultLoad: 25,
            model: '水平弧形，两端简支，承受均布荷载，需考虑扭矩',
            momentFormula: '按简支梁近似：M = qL²/8（L为弧长）',
            shearFormula: 'V = qL/2',
            calc: function(L, q) {
                const M = q * L * L / 8;
                const V = q * L / 2;
                // 扭矩简化估算：按弧梁扭矩 T ≈ qL²/8 * tan(θ/2)，此处取近似系数
                const T = M * 0.2; // 假设扭矩为弯矩的20%
                return { M, V, T };
            },
            reinforcement: function(L, q, result) {
                const fy = 360, h0 = 560, b = 300;
                const Mmax = result.M;
                const As = Mmax * 1e6 / (0.9 * fy * h0);
                // 抗扭钢筋简化：按扭矩计算受扭纵筋和箍筋
                return { As, fy, h0, b };
            },
            seismic: function(L, q) {
                return `抗震要求：弧形梁箍筋应全长加密，间距 ≤ 100 mm\n` +
                       `因受扭，纵筋需沿截面周边布置，且受扭纵筋间距 ≤ 200 mm\n` +
                       `箍筋需做成封闭式，弯钩角度不小于 135°\n` +
                       `扭矩较大时需配置抗扭腰筋`;
            }
        },
        steel: {
            name: '工字钢梁',
            defaultSpan: 8,
            defaultLoad: 35,
            model: '简支钢梁，材质 Q235，截面 HN350×175',
            momentFormula: 'M = qL²/8',
            shearFormula: 'V = qL/2',
            calc: function(L, q) {
                const M = q * L * L / 8;
                const V = q * L / 2;
                return { M, V };
            },
            reinforcement: function(L, q, result) {
                // 钢梁验算
                const f = 215; // N/mm² Q235
                const fv = 125; // N/mm²
                const Wx = 782e3; // mm³ (782 cm³)
                const Ix = 13600e4; // mm⁴
                const tw = 7; // mm
                const E = 206e3; // N/mm²
                const Mmax = result.M * 1e6; // N·mm
                const Vmax = result.V * 1e3; // N
                const sigma = Mmax / Wx; // N/mm²
                const tau = Vmax * 1.5 / (350 * tw); // 简化平均剪应力
                const deflection = 5 * q * L * L * L * L * 1e9 / (384 * E * Ix * L); // 简化，需修正单位
                const deflLimit = L * 1000 / 250; // mm
                const defl = (5 * q * Math.pow(L,4) * 1e12) / (384 * E * Ix) * 1e-3; // mm 近似
                return { sigma, tau, f, fv, deflection: defl, deflLimit, As: 0 };
            },
            seismic: function(L, q) {
                return `抗震要求：钢结构梁需满足节点延性要求，通常无需箍筋\n` +
                       `需验算整体稳定和局部稳定\n` +
                       `挠度限值：L/250 = ${(L*1000/250).toFixed(0)} mm`;
            }
        },
        lintel: {
            name: '构造梁（过梁）',
            defaultSpan: 2,
            defaultLoad: 10,
            model: '门窗洞口上方简支梁，承受上部墙体荷载',
            momentFormula: 'M = qL²/8',
            shearFormula: 'V = qL/2',
            calc: function(L, q) {
                const M = q * L * L / 8;
                const V = q * L / 2;
                return { M, V };
            },
            reinforcement: function(L, q, result) {
                const fy = 360, h0 = 260, b = 240; // 过梁截面 240x300，h0约260
                const Mmax = result.M;
                const As = Mmax * 1e6 / (0.9 * fy * h0);
                const minAs = 0.002 * b * h0; // 最小配筋率0.2%
                const finalAs = Math.max(As, minAs);
                return { As: finalAs, fy, h0, b };
            },
            seismic: function(L, q) {
                return `抗震要求：不考虑抗震，按构造配筋即可\n` +
                       `典型配筋：纵筋 2Φ12，箍筋 φ6@200\n` +
                       `过梁两端伸入墙体长度 ≥ 240 mm`;
            }
        }
    };

    // ==================== 当前状态 ====================
    let currentType = 'main';
    let currentSpan = beamTypes.main.defaultSpan;
    let currentLoad = beamTypes.main.defaultLoad;

    // ==================== 类型按钮切换 ====================
    typeButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const type = this.dataset.type;
            setType(type, true); // 切换时自动设置该类型默认参数
        });
    });

    function setType(type, resetParams = false) {
        currentType = type;
        typeButtons.forEach(b => b.classList.remove('active'));
        document.querySelector(`.type-btn[data-type="${type}"]`).classList.add('active');
        if (resetParams) {
            const defaults = beamTypes[type];
            currentSpan = defaults.defaultSpan;
            currentLoad = defaults.defaultLoad;
            spanSlider.value = currentSpan;
            loadSlider.value = currentLoad;
            spanValue.textContent = currentSpan.toFixed(1);
            loadValue.textContent = currentLoad;
        }
        updateAll();
    }

    // ==================== 参数滑块 ====================
    spanSlider.addEventListener('input', function() {
        currentSpan = parseFloat(this.value);
        spanValue.textContent = currentSpan.toFixed(1);
        updateAll();
    });
    loadSlider.addEventListener('input', function() {
        currentLoad = parseFloat(this.value);
        loadValue.textContent = currentLoad;
        updateAll();
    });

    // ==================== 恢复典型参数 ====================
    resetBtn.addEventListener('click', function() {
        setType(currentType, true);
    });

    // ==================== 更新画布与结果 ====================
    function updateAll() {
        drawCanvas();
        updateResultText();
    }

    function drawCanvas() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        const type = beamTypes[currentType];
        const L = currentSpan;
        const q = currentLoad;

        // 通用绘图参数
        const marginLeft = 120, marginRight = 80;
        const beamY = 160; // 梁中心线高度
        const scaleX = (W - marginLeft - marginRight) / L; // px per meter

        // 绘制荷载箭头（均布）
        ctx.strokeStyle = '#d9534f';
        ctx.fillStyle = '#d9534f';
        ctx.lineWidth = 2;
        for (let x = marginLeft + 20; x < W - marginRight - 20; x += 40) {
            const arrowHeight = 20 + q * 0.3;
            ctx.beginPath();
            ctx.moveTo(x, beamY - 15);
            ctx.lineTo(x, beamY - 15 - arrowHeight);
            ctx.stroke();
            // 箭头头部
            ctx.beginPath();
            ctx.moveTo(x - 4, beamY - 15 - arrowHeight + 6);
            ctx.lineTo(x, beamY - 15 - arrowHeight);
            ctx.lineTo(x + 4, beamY - 15 - arrowHeight + 6);
            ctx.fill();
        }

        // 根据类型绘制支座和梁体
        if (currentType === 'steel') {
            // 工字钢梁：绘制工字形截面
            ctx.fillStyle = '#666';
            const flangeW = 40, flangeH = 8, webH = 30, webW = 6;
            // 上翼缘
            ctx.fillRect(marginLeft, beamY - 15 - flangeH, W - marginLeft - marginRight, flangeH);
            // 下翼缘
            ctx.fillRect(marginLeft, beamY + 15, W - marginLeft - marginRight, flangeH);
            // 腹板
            ctx.fillRect(marginLeft, beamY - 15, W - marginLeft - marginRight, 30);
            // 支座简支符号
            drawSimpleSupport(marginLeft, beamY + 15);
            drawSimpleSupport(W - marginRight, beamY + 15);
        } else if (currentType === 'curved') {
            // 弧形梁：绘制弧线
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 12;
            ctx.beginPath();
            const startX = marginLeft, endX = W - marginRight;
            const controlX = (startX + endX) / 2;
            const controlY = beamY + 60; // 弧线下垂
            ctx.moveTo(startX, beamY);
            ctx.quadraticCurveTo(controlX, controlY, endX, beamY);
            ctx.stroke();
            // 简支支座
            drawSimpleSupport(startX, beamY + 30);
            drawSimpleSupport(endX, beamY + 30);
            // 扭矩示意箭头
            ctx.strokeStyle = '#f0a030';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(controlX, controlY - 20, 25, 0, Math.PI * 1.5);
            ctx.stroke();
            ctx.fillStyle = '#f0a030';
            ctx.font = '12px Microsoft YaHei';
            ctx.fillText('扭矩', controlX - 10, controlY - 40);
        } else {
            // 混凝土梁（矩形）
            ctx.fillStyle = '#888';
            const beamHeight = 30;
            ctx.fillRect(marginLeft, beamY - beamHeight/2, W - marginLeft - marginRight, beamHeight);
            // 根据类型绘制支座
            if (currentType === 'main' || currentType === 'coupling') {
                // 固接支座
                drawFixedSupport(marginLeft, beamY);
                drawFixedSupport(W - marginRight, beamY);
            } else {
                // 简支支座
                drawSimpleSupport(marginLeft, beamY + beamHeight/2);
                drawSimpleSupport(W - marginRight, beamY + beamHeight/2);
            }
        }

        // 绘制弯矩图（简化示意）
        const result = type.calc(L, q);
        ctx.strokeStyle = '#0275d8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const momentCurveY = beamY + 80; // 弯矩图基准线
        const maxMoment = Math.max(Math.abs(result.Mpos || 0), Math.abs(result.Mneg || 0), Math.abs(result.M || 0), 0.01);
        const momentScale = 50 / maxMoment; // 缩放系数
        if (currentType === 'main' || currentType === 'coupling') {
            // 固接梁弯矩图：支座负弯矩，跨中正弯矩
            // 先画负弯矩部分（在基线上方）
            ctx.moveTo(marginLeft, momentCurveY - result.Mneg * momentScale);
            ctx.lineTo(marginLeft + (W - marginLeft - marginRight) * 0.5, momentCurveY + result.Mpos * momentScale);
            ctx.lineTo(W - marginRight, momentCurveY - result.Mneg * momentScale);
            ctx.stroke();
            // 填色
            ctx.fillStyle = 'rgba(2,117,216,0.1)';
            ctx.beginPath();
            ctx.moveTo(marginLeft, momentCurveY);
            ctx.lineTo(marginLeft, momentCurveY - result.Mneg * momentScale);
            ctx.lineTo(marginLeft + (W - marginLeft - marginRight) * 0.5, momentCurveY + result.Mpos * momentScale);
            ctx.lineTo(W - marginRight, momentCurveY - result.Mneg * momentScale);
            ctx.lineTo(W - marginRight, momentCurveY);
            ctx.closePath();
            ctx.fill();
        } else {
            // 简支梁弯矩图：抛物线
            for (let px = 0; px <= W - marginLeft - marginRight; px++) {
                const xReal = (px / (W - marginLeft - marginRight)) * L;
                const M = q * xReal * (L - xReal) / 2; // 简支梁弯矩分布
                const y = momentCurveY - M * momentScale;
                if (px === 0) ctx.moveTo(marginLeft + px, y);
                else ctx.lineTo(marginLeft + px, y);
            }
            ctx.stroke();
            // 填色
            ctx.fillStyle = 'rgba(2,117,216,0.1)';
            ctx.beginPath();
            ctx.moveTo(marginLeft, momentCurveY);
            for (let px = 0; px <= W - marginLeft - marginRight; px++) {
                const xReal = (px / (W - marginLeft - marginRight)) * L;
                const M = q * xReal * (L - xReal) / 2;
                const y = momentCurveY - M * momentScale;
                ctx.lineTo(marginLeft + px, y);
            }
            ctx.lineTo(W - marginRight, momentCurveY);
            ctx.closePath();
            ctx.fill();
        }

        // 标注关键数值
        ctx.fillStyle = '#0275d8';
        ctx.font = 'bold 14px Microsoft YaHei';
        if (currentType === 'main' || currentType === 'coupling') {
            ctx.fillText(`M支座 = ${result.Mneg.toFixed(1)} kN·m`, marginLeft + 10, momentCurveY - result.Mneg * momentScale - 10);
            ctx.fillText(`M跨中 = ${result.Mpos.toFixed(1)} kN·m`, marginLeft + (W - marginLeft - marginRight)*0.5 - 40, momentCurveY + result.Mpos * momentScale - 10);
        } else {
            const Mmax = result.M;
            ctx.fillText(`Mmax = ${Mmax.toFixed(1)} kN·m`, marginLeft + (W - marginLeft - marginRight)*0.5 - 50, momentCurveY - Mmax * momentScale - 10);
        }

        // 绘制文字说明
        ctx.fillStyle = '#333';
        ctx.font = '14px Microsoft YaHei';
        ctx.fillText(`梁类型：${type.name}`, 20, 30);
        ctx.fillText(`跨度 L = ${L} m，荷载 q = ${q} kN/m`, 20, 55);
        ctx.fillText('弯矩图（蓝色）', 20, 75);
    }

    function drawSimpleSupport(x, y) {
        // 简支支座：三角形+圆
        ctx.fillStyle = '#333';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        // 三角形
        ctx.beginPath();
        ctx.moveTo(x - 15, y);
        ctx.lineTo(x + 15, y);
        ctx.lineTo(x, y - 20);
        ctx.closePath();
        ctx.fill();
        // 圆
        ctx.beginPath();
        ctx.arc(x, y - 25, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawFixedSupport(x, y) {
        // 固接支座：斜线填充
        ctx.fillStyle = '#333';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.fillRect(x - 12, y - 15, 24, 30);
        // 斜线
        for (let i = -10; i <= 10; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x - 12, y + i);
            ctx.lineTo(x + 12, y + i + 15);
            ctx.stroke();
        }
    }

    function updateResultText() {
        const type = beamTypes[currentType];
        const L = currentSpan;
        const q = currentLoad;
        const result = type.calc(L, q);

        let html = '';
        html += `<div style="margin-bottom:10px;"><strong>计算模型：</strong>${type.model}</div>`;
        html += `<div style="margin-bottom:10px;"><strong>内力公式：</strong>${type.momentFormula}，${type.shearFormula}</div>`;

        if (currentType === 'steel') {
            const reinf = type.reinforcement(L, q, result);
            const strengthOK = reinf.sigma <= reinf.f ? '满足' : '不满足';
            const shearOK = reinf.tau <= reinf.fv ? '满足' : '不满足';
            const deflOK = reinf.deflection <= reinf.deflLimit ? '满足' : '不满足';
            html += `<table>
                <tr><th>验算项目</th><th>计算值</th><th>限值</th><th>结果</th></tr>
                <tr><td>抗弯强度 σ = M/Wx</td><td>${reinf.sigma.toFixed(1)} N/mm²</td><td>${reinf.f} N/mm²</td><td>${strengthOK}</td></tr>
                <tr><td>抗剪强度 τ = V/Aw</td><td>${reinf.tau.toFixed(1)} N/mm²</td><td>${reinf.fv} N/mm²</td><td>${shearOK}</td></tr>
                <tr><td>挠度</td><td>${reinf.deflection.toFixed(1)} mm</td><td>${reinf.deflLimit.toFixed(1)} mm</td><td>${deflOK}</td></tr>
            </table>`;
            html += `<div style="margin-top:10px;">${type.seismic(L, q)}</div>`;
        } else {
            const reinf = type.reinforcement(L, q, result);
            const As = reinf.As;
            // 选择合适钢筋直径和根数
            const barDia = 20; // mm
            const barArea = Math.PI * barDia * barDia / 4;
            const barCount = Math.ceil(As / barArea);
            html += `<div style="margin-bottom:10px;"><strong>配筋计算：</strong>
                最大弯矩 M = ${Math.max(Math.abs(result.M || 0), Math.abs(result.Mneg || 0), Math.abs(result.Mpos || 0)).toFixed(1)} kN·m，
                As = M / (0.9 × fy × h0) = ${Math.max(Math.abs(result.M || 0), Math.abs(result.Mneg || 0), Math.abs(result.Mpos || 0)).toFixed(1)} × 10⁶ / (0.9 × 360 × 560) = <span class="highlight">${As.toFixed(0)} mm²</span>
                （约需 ${barCount} 根直径 ${barDia} mm 钢筋，实际面积 ${Math.ceil(barCount) * barArea.toFixed(0)} mm²）
            </div>`;
            html += `<div style="margin-top:10px;">${type.seismic(L, q)}</div>`;
        }

        calcText.innerHTML = html;
    }

    // ==================== 初始化 ====================
    setType('main', true);
</script>
</body>
</html>
